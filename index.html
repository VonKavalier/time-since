<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depuis cette date</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #222;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 2rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      max-width: 800px;
      width: 100%;
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      margin: 0;
    }

    .date {
      margin: .8rem 0 2rem;
      color: #666;
      font-size: 1.1rem;
    }

    hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 1.5rem 0;
    }

    #days {
      transition: .2s;
    }

    .line {
      font-size: 1.2rem;
      margin: .7rem 0;
    }

    .hint {
      color: #888;
    }

    #elapsedMain {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .45rem .7rem;

      font-size: clamp(2rem, 6vw, 3.6rem);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    #elapsedMain span {
      white-space: nowrap;
      padding: .15em .45em;
    }

    #elapsedClock {
      font-size: clamp(1.2rem, 3.2vw, 2rem);
      font-weight: 600;
      margin: .9rem 0 1.2rem;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
    <main class="card">
      <h1 id="elapsedMain">—</h1>
      <div class="hint" id="hint"></div>
      <div class="date" id="date"></div>

      <div class="line" id="elapsedClock"></div>

      <hr>

      <div class="line" id="days"></div>
      <div class="line" id="weeks"></div>
      <div class="line" id="months"></div>
      <div class="line" id="hours"></div>
      <div class="line" id="minutes"></div>
      <div class="line" id="seconds"></div>
    </main>

    <script>
    const qs = new URLSearchParams(location.search);
    const dateStr = qs.get("date");

    const elapsedMain =
      document.getElementById("elapsedMain");

    const elapsedClock =
      document.getElementById("elapsedClock");

    const dateEl =
      document.getElementById("date");

    const daysEl =
      document.getElementById("days");

    const weeksEl =
      document.getElementById("weeks");

    const monthsEl =
      document.getElementById("months");

    const hoursEl =
      document.getElementById("hours");

    const minutesEl =
      document.getElementById("minutes");

    const secondsEl =
      document.getElementById("seconds");

    const hintEl =
      document.getElementById("hint");

    function mondayOfWeek(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff =
        day === 0 ? -6 : 1 - day;

      d.setDate(d.getDate() + diff);
      d.setHours(0,0,0,0);
      return d;
    }

    function diffParts(start, end) {
      let years =
        end.getFullYear() -
        start.getFullYear();

      let months =
        end.getMonth() -
        start.getMonth();

      let days =
        end.getDate() -
        start.getDate();

      let hours =
        end.getHours() -
        start.getHours();

      let minutes =
        end.getMinutes() -
        start.getMinutes();

      let seconds =
        end.getSeconds() -
        start.getSeconds();

      if (seconds < 0) {
        seconds += 60;
        minutes--;
      }

      if (minutes < 0) {
        minutes += 60;
        hours--;
      }

      if (hours < 0) {
        hours += 24;
        days--;
      }

      if (days < 0) {
        months--;

        const prevMonthDays =
          new Date(
            end.getFullYear(),
            end.getMonth(),
            0
          ).getDate();

        days += prevMonthDays;
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      return {
        years,
        months,
        days,
        hours,
        minutes,
        seconds
      };
    }

    if (!dateStr) {
      hintEl.textContent =
        "Ajoute ?date=AAAA-MM-JJ";
    } else {

      const start =
        new Date(dateStr + "T00:00:00");

      function render() {
        const now = new Date();

        const diffMs = now - start;

        const totalDays =
          Math.floor(diffMs / 86400000);

        const totalHours =
          Math.floor(diffMs / 3600000);

        const totalMinutes =
          Math.floor(diffMs / 60000);

        const totalSeconds =
          Math.floor(diffMs / 1000);

        const mondayStart =
          mondayOfWeek(start);

        const mondayToday =
          mondayOfWeek(now);

        const calendarWeeks =
          Math.floor(
            (mondayToday - mondayStart) /
            86400000 / 7
          );

        const remainingDays =
          Math.floor(
            (now - mondayToday) /
            86400000
          );

        const parts =
          diffParts(start, now);

        const totalMonths =
          parts.years * 12 +
          parts.months;

       elapsedMain.innerHTML =
      `<span>${parts.years} an${parts.years > 1 ? "s" : ""}</span>
       <span>${parts.months} mois</span>
       <span>${parts.days} jour${parts.days > 1 ? "s" : ""}</span>`;

        elapsedClock.textContent =
          `${String(parts.hours).padStart(2,"0")}h `
          + `${String(parts.minutes).padStart(2,"0")}m `
          + `${String(parts.seconds).padStart(2,"0")}s`;

        dateEl.textContent =
          `depuis le ${start.toLocaleDateString("fr-FR")}`;

        daysEl.textContent =
          `${totalDays.toLocaleString("fr-FR")} jours`;

        weeksEl.textContent =
          `${calendarWeeks} semaines et ${remainingDays} jours`;

        monthsEl.textContent =
          `${totalMonths} mois`;

        hoursEl.textContent =
          `${totalHours.toLocaleString("fr-FR")} heures`;

        minutesEl.textContent =
          `${totalMinutes.toLocaleString("fr-FR")} minutes`;

        secondsEl.textContent =
          `${totalSeconds.toLocaleString("fr-FR")} secondes`;
      }

      render();
      setInterval(render, 1000);
    }
    </script>
</body>
</html>
