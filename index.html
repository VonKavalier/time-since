<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depuis cette date</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #222;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 2rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      margin: 0;
    }

    .date {
      margin: .8rem 0 2rem;
      color: #666;
      font-size: 1.1rem;
    }

    .line {
      font-size: 1.3rem;
      margin: .8rem 0;
    }

    .hint {
      color: #888;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="days">—</h1>
    <div class="date" id="date"></div>

    <div class="line" id="weeks"></div>
    <div class="line" id="months"></div>
    <div class="line" id="years"></div>

    <div class="hint" id="hint"></div>
  </main>

  <script>
    const qs = new URLSearchParams(location.search);
    const dateStr = qs.get("date");

    const daysEl = document.getElementById("days");
    const dateEl = document.getElementById("date");
    const weeksEl = document.getElementById("weeks");
    const monthsEl = document.getElementById("months");
    const yearsEl = document.getElementById("years");
    const hintEl = document.getElementById("hint");

    if (!dateStr) {
      hintEl.textContent =
        "Ajoute ?date=AAAA-MM-JJ à l’URL";
    } else {
      const start = new Date(dateStr + "T00:00:00");
      const today = new Date();

      today.setHours(0,0,0,0);

      const diffMs = today - start;
      const totalDays =
        Math.floor(diffMs / 86400000);

      const weeks = Math.floor(totalDays / 7);
      const remDaysWeeks = totalDays % 7;

      // mois/années exacts calendrier
      let years = today.getFullYear() - start.getFullYear();
      let months = today.getMonth() - start.getMonth();
      let days = today.getDate() - start.getDate();

      if (days < 0) {
        months--;
        const prevMonth =
          new Date(today.getFullYear(),
                   today.getMonth(), 0).getDate();
        days += prevMonth;
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      const totalMonths =
        years * 12 + months;

      daysEl.textContent =
        `${totalDays} jours`;

      dateEl.textContent =
        `depuis le ${start.toLocaleDateString("fr-FR")}`;

      weeksEl.textContent =
        `${weeks} semaines et ${remDaysWeeks} jours`;

      monthsEl.textContent =
        `${totalMonths} mois et ${days} jours`;

      yearsEl.textContent =
        `${years} ans, ${months} mois et ${days} jours`;
    }
  </script>
</body>
</html>
